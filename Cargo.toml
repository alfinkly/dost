[package]
name = "dost"
version = "0.2.0"
edition = "2021"
description = "Terminal player for Ansible: menu, live scenes, plain-language summaries"
license = "Apache-2.0"
repository = "https://github.com/alfinkly/dost"
rust-version = "1.80"

[lib]
name = "dost"
path = "src/lib.rs"

[[bin]]
name = "dost"
path = "src/main.rs"

[dependencies]
anyhow = "1"
glob = "0.3"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
semver = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = "0.7"
minijinja = "2"
nix = { version = "0.29", features = ["fs", "signal", "process", "user"] }
zeroize = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
tempfile = "3"

